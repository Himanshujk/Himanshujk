<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Himanshu Jakhmola, Go backend engineer</title>
  <desc id="d">Name and tagline on the left. On the right, a simplified map of a platform he ran: web and mobile backend-for-frontend layers calling 20 to 25 Go microservices, backed by CockroachDB, Elasticsearch and vector database clusters.</desc>

  <rect width="1200" height="360" rx="24" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="24" fill="none" stroke="#30363d"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="56" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="2" fill="#00ADD8">GO BACKEND ENGINEER · DISTRIBUTED SYSTEMS</text>
    <text x="56" y="146" font-size="56" font-weight="700" fill="#e6edf3">Himanshu Jakhmola</text>
    <text x="56" y="196" font-size="24" fill="#c9d1d9">I build Go microservices, gRPC and</text>
    <text x="56" y="230" font-size="24" fill="#c9d1d9">PostgreSQL-backed APIs, and keep them running.</text>
    <text x="56" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8b949e">5+ years of Go · Delhi, India</text>
    <text x="56" y="322" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8b949e">open to remote and relocation</text>
  </g>

  <g id="project-proof" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <!-- BFF layer -->
    <rect x="700" y="36" width="190" height="46" rx="10" fill="none" stroke="#30363d"/>
    <text x="795" y="66" text-anchor="middle" font-size="17" fill="#c9d1d9">web BFF</text>
    <rect x="910" y="36" width="190" height="46" rx="10" fill="none" stroke="#30363d"/>
    <text x="1005" y="66" text-anchor="middle" font-size="17" fill="#c9d1d9">mobile BFF</text>
    <path d="M795 82 V118 M1005 82 V118" stroke="#00ADD8" stroke-width="1.5" fill="none"/>

    <!-- Go services -->
    <rect x="700" y="118" width="400" height="76" rx="12" fill="#0d2a35" stroke="#00ADD8" stroke-width="1.5"/>
    <text x="720" y="147" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#e6edf3">20-25 Go microservices</text>
    <g fill="#00ADD8">
      <rect x="720.0" y="162" width="12" height="16" rx="3"/><rect x="736.4" y="162" width="12" height="16" rx="3"/><rect x="752.8" y="162" width="12" height="16" rx="3"/><rect x="769.2" y="162" width="12" height="16" rx="3"/><rect x="785.6" y="162" width="12" height="16" rx="3"/><rect x="802.0" y="162" width="12" height="16" rx="3"/><rect x="818.4" y="162" width="12" height="16" rx="3"/><rect x="834.8" y="162" width="12" height="16" rx="3"/><rect x="851.2" y="162" width="12" height="16" rx="3"/><rect x="867.6" y="162" width="12" height="16" rx="3"/><rect x="884.0" y="162" width="12" height="16" rx="3"/><rect x="900.4" y="162" width="12" height="16" rx="3"/><rect x="916.8" y="162" width="12" height="16" rx="3"/><rect x="933.2" y="162" width="12" height="16" rx="3"/><rect x="949.6" y="162" width="12" height="16" rx="3"/><rect x="966.0" y="162" width="12" height="16" rx="3"/><rect x="982.4" y="162" width="12" height="16" rx="3"/><rect x="998.8" y="162" width="12" height="16" rx="3"/><rect x="1015.2" y="162" width="12" height="16" rx="3"/><rect x="1031.6" y="162" width="12" height="16" rx="3"/><rect x="1048.0" y="162" width="12" height="16" rx="3"/><rect x="1064.4" y="162" width="12" height="16" rx="3"/>
    </g>
    <path d="M765 194 V232 M905 194 V232 M1045 194 V232" stroke="#00ADD8" stroke-width="1.5" fill="none"/>

    <!-- Data layer -->
    <rect x="700" y="232" width="130" height="92" rx="10" fill="none" stroke="#30363d"/>
    <text x="765" y="256" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">CockroachDB</text>
    <g fill="#00ADD8"><circle cx="737" cy="278" r="5"/><circle cx="757" cy="278" r="5"/><circle cx="777" cy="278" r="5"/><circle cx="737" cy="296" r="5"/><circle cx="757" cy="296" r="5"/><circle cx="777" cy="296" r="5"/></g>
    <text x="765" y="318" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#8b949e">2 × 3 nodes</text>

    <rect x="840" y="232" width="130" height="92" rx="10" fill="none" stroke="#30363d"/>
    <text x="905" y="256" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Elasticsearch</text>
    <rect x="862" y="268" width="86" height="12" rx="6" fill="#00ADD8"/>
    <rect x="862" y="288" width="86" height="12" rx="6" fill="#00ADD8"/>
    <text x="905" y="318" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#8b949e">2 clusters</text>

    <rect x="980" y="232" width="130" height="92" rx="10" fill="none" stroke="#30363d"/>
    <text x="1045" y="256" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Vector DB</text>
    <rect x="1002" y="264" width="86" height="9" rx="4.5" fill="#00ADD8"/>
    <rect x="1002" y="279" width="86" height="9" rx="4.5" fill="#00ADD8"/>
    <rect x="1002" y="294" width="86" height="9" rx="4.5" fill="#00ADD8"/>
    <text x="1045" y="318" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#8b949e">3 clusters</text>

    <text x="1100" y="346" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#6e7681">simplified map of a platform I ran</text>
  </g>
</svg>
